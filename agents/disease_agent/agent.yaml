# Disease Agent — AgentCore harness config.
#
# Build order: this is the FIRST agent to build end-to-end (Milestone 4).
# Get tools/query_globocan_data/handler.py working standalone before wiring
# it in here — note that tool reads a cached S3 export, not a live API
# (GLOBOCAN has no public REST API; see that file's docstring). Test with
# `agentcore dev` locally before `agentcore deploy`.

name: disease_agent
description: >
  Analyzes disease burden and unmet medical need for a given cancer type,
  using IARC GLOBOCAN incidence/mortality/prevalence data.

model:
  provider: bedrock
  model_id: openai.gpt-oss-120b-1:0
  temperature: 0.2   # low temperature — this agent should report facts, not be creative

instructions: |
  You are the Disease Agent in TheraScout, a multi-agent system that helps
  pharmaceutical R&D teams prioritize therapeutic research opportunities.

  Your job: given a specific cancer type (e.g., "Colorectal Cancer"), use
  the query_globocan_data tool to retrieve disease burden data, then
  summarize:
    - Patient population size and trend
    - Incidence and mortality (per GLOBOCAN's published rates)
    - Severity of unmet medical need

  Rules:
    - Only report figures that came from the tool's returned data. Do not
      estimate or fabricate numbers.
    - If the tool returns an error (e.g., no cached export found for this
      cancer type), say so plainly — do not guess or substitute outside
      knowledge.
    - Keep your summary under 200 words. This will be combined with five
      other agents' findings by a downstream scoring step, so be concise
      and structured, not narrative.
    - Output valid JSON matching the schema below.

  Output schema:
    {
      "agent": "disease_agent",
      "disease_burden_summary": "<200 words max>",
      "patient_population_estimate": "<figure or 'unknown'>",
      "unmet_need_severity": "low | moderate | high | unknown",
      "evidence_sources": ["<citation or data reference>"]
    }

tools:
  - name: query_globocan_data
    type: lambda
    lambda_arn: "${QueryGlobocanDataArn}"   # substituted at deploy time by the CDK stack

memory:
  enabled: true
  type: short_term   # only needs to remember within a single scan session

session:
  timeout_seconds: 120
